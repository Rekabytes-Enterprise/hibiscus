[package]
name = "hibiscus"
version = "0.2.3"
edition = "2021"
description = "A Rust CLI for the Pi agent over RPC"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["rc"] }
serde_json = { version = "1", features = ["raw_value"] }
libc = "0.2"

[dev-dependencies]
# Integration tests use only the standard library.

[[bench]]
name = "formatter"
harness = false

[[bench]]
name = "session_list"
harness = false

[[bench]]
name = "allocations"
harness = false
