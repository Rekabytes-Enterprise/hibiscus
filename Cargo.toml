[package]
name = "hibiscus"
version = "0.3.7"
edition = "2021"
description = "A standalone Rust coding agent"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["rc", "derive"] }
serde_json = { version = "1", features = ["raw_value"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "process", "macros"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
unicode-width = { version = "0.2.2", default-features = false }
jsonschema = { version = "0.60.2", default-features = false }

[dev-dependencies]
# Integration tests use only the standard library.

[[bench]]
name = "formatter"
harness = false

[[bench]]
name = "session_list"
harness = false

[[bench]]
name = "allocations"
harness = false
