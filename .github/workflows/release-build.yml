name: Release build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      target:
        required: true
        type: string
      runner:
        required: true
        type: string
      cache_transport:
        required: true
        type: boolean
    outputs:
      sha256:
        value: ${{ jobs.build.outputs.sha256 }}
      cache_key:
        value: ${{ jobs.build.outputs.cache_key }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    outputs:
      sha256: ${{ steps.receipt.outputs.sha256 }}
      cache_key: ${{ steps.receipt.outputs.cache_key }}
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - name: Validate target and runner
        shell: bash
        env:
          BUILD_RUNNER: ${{ inputs.runner }}
        run: |
          case "$TARGET:$BUILD_RUNNER" in
            x86_64-unknown-linux-musl:ubuntu-latest | aarch64-unknown-linux-musl:ubuntu-latest | x86_64-apple-darwin:macos-15-intel | aarch64-apple-darwin:macos-15) ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: ${{ inputs.target }}
      - name: Build Linux binary
        if: runner.os == 'Linux'
        shell: bash
        env:
          CROSS_TARGET_X86_64_UNKNOWN_LINUX_MUSL_IMAGE: ghcr.io/cross-rs/x86_64-unknown-linux-musl@sha256:77db671d8356a64ae72a3e1415e63f547f26d374fbe3c4762c1cd36c7eac7b99
          CROSS_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_IMAGE: ghcr.io/cross-rs/aarch64-unknown-linux-musl@sha256:702154f52b2d8091671aa2c84d5582d849f949977228c735ff8462f93cc0e1e4
        run: |
          cargo install cross --locked --version 0.2.5
          cross build --locked --release --target "$TARGET"
      - name: Build macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --locked --release --target "$TARGET"
          codesign --force --sign - "target/$TARGET/release/hibiscus"
      - name: Package binary and receipt
        id: receipt
        shell: bash
        run: |
          mkdir -p dist package
          cp "target/$TARGET/release/hibiscus" package/hibiscus
          archive="dist/hibiscus-$TARGET.tar.gz"
          COPYFILE_DISABLE=1 tar -C package -czf "$archive" hibiscus
          digest=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'cache_key=release-%s-%s-%s\n' "$GITHUB_RUN_ID" "$TARGET" "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.cache_transport }}
        with:
          name: release-${{ inputs.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 5
          archive: true
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: inputs.cache_transport
        with:
          path: dist/hibiscus-${{ inputs.target }}.tar.gz
          key: ${{ steps.receipt.outputs.cache_key }}
