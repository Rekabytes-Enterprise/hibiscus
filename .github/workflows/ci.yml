name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, Clippy, and installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned secret detector
        id: secret_scanner
        shell: bash
        run: |
          scanner=$(python3 scripts/secret-scanning.py install --directory "$RUNNER_TEMP/secret-detector")
          printf 'path=%s\n' "$scanner" >> "$GITHUB_OUTPUT"
      - name: Test actual secret detection and failure handling
        env:
          SCANNER_PATH: ${{ steps.secret_scanner.outputs.path }}
        run: python3 tests/secret_scanning.py --scanner "$SCANNER_PATH"
      - name: Scan complete Git history for secrets
        env:
          SCANNER_PATH: ${{ steps.secret_scanner.outputs.path }}
        run: python3 scripts/secret-scanning.py git --scanner "$SCANNER_PATH"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Test audit policy and failure handling
        run: python3 tests/dependency_audit.py
      - name: Test workflow trust boundaries
        run: python3 tests/workflows.py
      - name: Test release provenance policy
        run: python3 tests/release_provenance.py
      - name: Test real provenance verification
        shell: bash
        run: |
          verifier=$(python3 scripts/release_provenance.py verifier --directory "$RUNNER_TEMP/provenance-verifier")
          python3 tests/provenance_verifier.py --verifier "$verifier"
      - name: Test installer and version bump
        run: sh -n install.sh && sh -n scripts/bump-version.sh && sh tests/install.sh && sh tests/bump-version.sh

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test npm installer without downloads
        run: node tests/npm-install.mjs
      - name: Run Rust tests
        timeout-minutes: 5
        # PTY fixtures must configure their own terminal, not inherit the runner's.
        env:
          TERM: dumb
        run: cargo test --locked
