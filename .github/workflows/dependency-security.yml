name: Dependency security

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - name: Install pinned auditor
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit production lockfile
        run: python3 scripts/audit-dependencies.py --db "$RUNNER_TEMP/rustsec-db" --report "$RUNNER_TEMP/dependency-audit.json"
      - name: Test audit failures and real vulnerable input
        env:
          HIBISCUS_AUDIT_TEST_DB: ${{ runner.temp }}/rustsec-db
        run: python3 tests/dependency_audit.py
      - name: Retain audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit.json
          retention-days: 5
          if-no-files-found: warn
