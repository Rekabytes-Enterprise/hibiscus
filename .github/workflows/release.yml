name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild and upload; empty means build only
        required: false
        type: string
        default: ""
      direct_upload:
        description: Use cache transport if artifact storage is unavailable; an empty tag tests transport only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && github.ref_name) || '' }}

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --check
      - name: Test workflow trust boundaries when present in release source
        if: hashFiles('tests/workflows.py') != ''
        run: python3 tests/workflows.py
      - run: sh -n install.sh && sh -n scripts/bump-version.sh && sh tests/install.sh && sh tests/bump-version.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node tests/npm-install.mjs
      - run: cargo test --locked
        env:
          TERM: dumb
        timeout-minutes: 5
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check release tag matches Cargo version
        if: env.RELEASE_TAG != ''
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          version=$(awk -F ' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)
          test "v$version" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git show --no-patch --format='Release source: %H' HEAD
      - name: Require an existing draft for direct uploads
        if: inputs.direct_upload && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -n "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true

  linux_x64:
    needs: verify
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
    with:
      source_ref: ${{ inputs.release_tag || github.ref }}
      target: x86_64-unknown-linux-musl
      runner: ubuntu-latest
      cache_transport: ${{ inputs.direct_upload || false }}

  linux_arm64:
    needs: verify
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
    with:
      source_ref: ${{ inputs.release_tag || github.ref }}
      target: aarch64-unknown-linux-musl
      runner: ubuntu-latest
      cache_transport: ${{ inputs.direct_upload || false }}

  macos_x64:
    needs: verify
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
    with:
      source_ref: ${{ inputs.release_tag || github.ref }}
      target: x86_64-apple-darwin
      runner: macos-15-intel
      cache_transport: ${{ inputs.direct_upload || false }}

  macos_arm64:
    needs: verify
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
    with:
      source_ref: ${{ inputs.release_tag || github.ref }}
      target: aarch64-apple-darwin
      runner: macos-15
      cache_transport: ${{ inputs.direct_upload || false }}

  verify_transport:
    needs: [linux_x64, linux_arm64, macos_x64, macos_arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.direct_upload }}
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: inputs.direct_upload
        with:
          path: dist/hibiscus-x86_64-unknown-linux-musl.tar.gz
          key: ${{ needs.linux_x64.outputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: inputs.direct_upload
        with:
          path: dist/hibiscus-aarch64-unknown-linux-musl.tar.gz
          key: ${{ needs.linux_arm64.outputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: inputs.direct_upload
        with:
          path: dist/hibiscus-x86_64-apple-darwin.tar.gz
          key: ${{ needs.macos_x64.outputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: inputs.direct_upload
        with:
          path: dist/hibiscus-aarch64-apple-darwin.tar.gz
          key: ${{ needs.macos_arm64.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Verify compiler receipts
        shell: bash
        env:
          LINUX_X64_SHA: ${{ needs.linux_x64.outputs.sha256 }}
          LINUX_ARM64_SHA: ${{ needs.linux_arm64.outputs.sha256 }}
          MACOS_X64_SHA: ${{ needs.macos_x64.outputs.sha256 }}
          MACOS_ARM64_SHA: ${{ needs.macos_arm64.outputs.sha256 }}
        run: |
          shopt -s nullglob dotglob
          files=(dist/*)
          test "${#files[@]}" -eq 4
          [[ "$LINUX_X64_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          test -f dist/hibiscus-x86_64-unknown-linux-musl.tar.gz && test ! -L dist/hibiscus-x86_64-unknown-linux-musl.tar.gz || exit 1
          printf '%s  %s\n' "$LINUX_X64_SHA" dist/hibiscus-x86_64-unknown-linux-musl.tar.gz | shasum -a 256 -c
          [[ "$LINUX_ARM64_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          test -f dist/hibiscus-aarch64-unknown-linux-musl.tar.gz && test ! -L dist/hibiscus-aarch64-unknown-linux-musl.tar.gz || exit 1
          printf '%s  %s\n' "$LINUX_ARM64_SHA" dist/hibiscus-aarch64-unknown-linux-musl.tar.gz | shasum -a 256 -c
          [[ "$MACOS_X64_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          test -f dist/hibiscus-x86_64-apple-darwin.tar.gz && test ! -L dist/hibiscus-x86_64-apple-darwin.tar.gz || exit 1
          printf '%s  %s\n' "$MACOS_X64_SHA" dist/hibiscus-x86_64-apple-darwin.tar.gz | shasum -a 256 -c
          [[ "$MACOS_ARM64_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          test -f dist/hibiscus-aarch64-apple-darwin.tar.gz && test ! -L dist/hibiscus-aarch64-apple-darwin.tar.gz || exit 1
          printf '%s  %s\n' "$MACOS_ARM64_SHA" dist/hibiscus-aarch64-apple-darwin.tar.gz | shasum -a 256 -c
  publish:
    if: github.event_name == 'push' || inputs.release_tag != ''
    needs: [verify_transport, linux_x64, linux_arm64, macos_x64, macos_arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.direct_upload }}
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: inputs.direct_upload
        with:
          path: dist/hibiscus-x86_64-unknown-linux-musl.tar.gz
          key: ${{ needs.linux_x64.outputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: inputs.direct_upload
        with:
          path: dist/hibiscus-aarch64-unknown-linux-musl.tar.gz
          key: ${{ needs.linux_arm64.outputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: inputs.direct_upload
        with:
          path: dist/hibiscus-x86_64-apple-darwin.tar.gz
          key: ${{ needs.macos_x64.outputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: inputs.direct_upload
        with:
          path: dist/hibiscus-aarch64-apple-darwin.tar.gz
          key: ${{ needs.macos_arm64.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Verify compiler receipts
        shell: bash
        env:
          LINUX_X64_SHA: ${{ needs.linux_x64.outputs.sha256 }}
          LINUX_ARM64_SHA: ${{ needs.linux_arm64.outputs.sha256 }}
          MACOS_X64_SHA: ${{ needs.macos_x64.outputs.sha256 }}
          MACOS_ARM64_SHA: ${{ needs.macos_arm64.outputs.sha256 }}
        run: |
          shopt -s nullglob dotglob
          files=(dist/*)
          test "${#files[@]}" -eq 4
          [[ "$LINUX_X64_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          test -f dist/hibiscus-x86_64-unknown-linux-musl.tar.gz && test ! -L dist/hibiscus-x86_64-unknown-linux-musl.tar.gz || exit 1
          printf '%s  %s\n' "$LINUX_X64_SHA" dist/hibiscus-x86_64-unknown-linux-musl.tar.gz | shasum -a 256 -c
          [[ "$LINUX_ARM64_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          test -f dist/hibiscus-aarch64-unknown-linux-musl.tar.gz && test ! -L dist/hibiscus-aarch64-unknown-linux-musl.tar.gz || exit 1
          printf '%s  %s\n' "$LINUX_ARM64_SHA" dist/hibiscus-aarch64-unknown-linux-musl.tar.gz | shasum -a 256 -c
          [[ "$MACOS_X64_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          test -f dist/hibiscus-x86_64-apple-darwin.tar.gz && test ! -L dist/hibiscus-x86_64-apple-darwin.tar.gz || exit 1
          printf '%s  %s\n' "$MACOS_X64_SHA" dist/hibiscus-x86_64-apple-darwin.tar.gz | shasum -a 256 -c
          [[ "$MACOS_ARM64_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          test -f dist/hibiscus-aarch64-apple-darwin.tar.gz && test ! -L dist/hibiscus-aarch64-apple-darwin.tar.gz || exit 1
          printf '%s  %s\n' "$MACOS_ARM64_SHA" dist/hibiscus-aarch64-apple-darwin.tar.gz | shasum -a 256 -c
      - name: Publish verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIRECT_UPLOAD: ${{ inputs.direct_upload || false }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
          if [ "$DIRECT_UPLOAD" = true ]; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" dist/* --clobber
          elif gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
