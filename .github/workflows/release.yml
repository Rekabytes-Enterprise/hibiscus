name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: sh -n install.sh && sh -n scripts/bump-version.sh && sh tests/install.sh && sh tests/bump-version.sh
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo test --locked
        timeout-minutes: 5
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check release tag matches Cargo version
        if: github.event_name == 'push'
        run: |
          version=$(awk -F ' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)
          test "v$version" = "$GITHUB_REF_NAME"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            builder: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            builder: cross
          - target: x86_64-apple-darwin
            os: macos-14
            builder: cargo
          - target: aarch64-apple-darwin
            os: macos-14
            builder: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --locked --version 0.2.5
      - name: Build Linux binary
        if: matrix.builder == 'cross'
        run: cross build --locked --release --target "${{ matrix.target }}"
      - name: Build macOS binary
        if: matrix.builder == 'cargo'
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Ad-hoc sign macOS binary
        if: runner.os == 'macOS'
        run: codesign --force --sign - "target/${{ matrix.target }}/release/hibiscus"
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/hibiscus" dist/package/hibiscus
          tar -C dist/package -czf "dist/hibiscus-${{ matrix.target }}.tar.gz" hibiscus
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
